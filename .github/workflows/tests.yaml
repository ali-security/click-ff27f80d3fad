name: Tests
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: pytest selector, forwarded as tox posargs; empty runs the full suite
        required: false
        default: ''
jobs:
  tests:
    name: ${{ matrix.name || matrix.python }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Every leg sets an explicit undotted `tox:` env name: modern tox
        # rejects the dotted alias (py3.13) that format('py{0}', matrix.python)
        # produces, and only accepts the envlist names (py313).
        include:
          - {python: '3.13', tox: py313}
          - {python: '3.12', tox: py312}
          - {name: Windows, python: '3.12', os: windows-latest, tox: py312}
          - {name: Mac, python: '3.12', os: macos-latest, tox: py312}
          - {python: '3.11', tox: py311}
          - {python: '3.10', tox: py310}
          - {python: '3.9', tox: py39}
          - {python: '3.8', tox: py38}
          # ubuntu-latest is 24.04, whose setup-python manifest has no 3.7 build.
          - {python: '3.7', os: ubuntu-22.04, tox: py37}
          - {name: PyPy, python: 'pypy-3.10', tox: pypy310}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: requirements*/*.txt
      - run: pip install tox
      - run: tox run -e ${{ matrix.tox || format('py{0}', matrix.python) }} -- ${{ inputs.test-filter }}
  typing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: requirements*/*.txt
      - name: cache mypy
        uses: actions/cache@v4
        with:
          path: ./.mypy_cache
          key: mypy|${{ hashFiles('pyproject.toml') }}
      - run: pip install tox
      - run: tox run -e typing
